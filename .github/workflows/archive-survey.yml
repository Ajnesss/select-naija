name: Research archive survey

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run probes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          UK_EDGE_URL: https://select-naija-uk-edge.vercel.app
          UK_EDGE_TOKEN: ${{ secrets.UK_EDGE_TOKEN }}
        run: node scripts/archive-survey.js
      - name: Save results
        run: |
          git config user.name "select-naija-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/out
          git diff --cached --quiet || git commit -m "Research probe results $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
