name: Research playback variants

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/playtest-variants.js
      - name: Save results
        run: |
          git config user.name "select-naija-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add research/out
          git diff --cached --quiet || git commit -m "Research playback variants $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
