name: Live addon check

on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 10 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/live-check.js
