name: Nightly verify

on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC daily, just after the YouTube API quota resets (midnight Pacific)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find Nigerian titles watchable in the UK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/discover.js
      - name: Read Tubi UK's Nollywood collection
        env:
          UK_EDGE_URL: https://select-naija-uk-edge.vercel.app
          UK_EDGE_TOKEN: ${{ secrets.UK_EDGE_TOKEN }}
        run: node scripts/discover-tubi.js
      - name: Read approved video channels
        run: node scripts/discover-dailymotion.js
      - name: Read approved YouTube channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/discover-youtube.js
      - name: Check every link
        env:
          VERIFY_LOCATION: github-actions
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          UK_EDGE_URL: https://select-naija-uk-edge.vercel.app
          UK_EDGE_TOKEN: ${{ secrets.UK_EDGE_TOKEN }}
        run: node scripts/verify.js
      - name: Coverage report
        run: node scripts/report.js
      - name: Save results
        run: |
          git config user.name "select-naija-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Nightly verification $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
