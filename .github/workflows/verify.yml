name: Nightly verify

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC every night
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every link
        env:
          VERIFY_LOCATION: github-actions (not UK; see README "Where checks run")
        run: node scripts/verify.js
      - name: Coverage report
        run: node scripts/report.js
      - name: Save results
        run: |
          git config user.name "select-naija-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json reports/
          git diff --cached --quiet || git commit -m "Nightly verification $(date -u +%Y-%m-%d)"
          git push
