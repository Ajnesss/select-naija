name: Research browser probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Open sites
        run: node scripts/browser-probe.js
      - name: Save results
        run: |
          git config user.name "select-naija-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/out
          git diff --cached --quiet || git commit -m "Research browser probe results $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
